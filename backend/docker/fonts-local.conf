<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Fontes do Windows/Office que não existem no worker → substituta instalada com o mesmo "jeito" (monoespaçada,
  com ou sem serifa) e, quando há, com as mesmas medidas (Liberation = Arial/Times/Courier; Carlito = Calibri;
  Caladea = Cambria). Sem isto o LibreOffice cai numa fonte padrão com serifa: um documento em Consolas saía em
  DejaVu Serif no PDF. O vínculo precisa ser "strong" — com o vínculo fraco o LibreOffice ignora o apelido.
-->
<fontconfig>
  <match target="pattern"><test name="family" qual="any"><string>Consolas</string></test><edit name="family" mode="assign" binding="strong"><string>Liberation Mono</string></edit></match>
  <match target="pattern"><test name="family" qual="any"><string>Lucida Console</string></test><edit name="family" mode="assign" binding="strong"><string>Liberation Mono</string></edit></match>
  <match target="pattern"><test name="family" qual="any"><string>Courier New</string></test><edit name="family" mode="assign" binding="strong"><string>Liberation Mono</string></edit></match>
  <match target="pattern"><test name="family" qual="any"><string>Courier</string></test><edit name="family" mode="assign" binding="strong"><string>Liberation Mono</string></edit></match>
  <match target="pattern"><test name="family" qual="any"><string>Arial</string></test><edit name="family" mode="assign" binding="strong"><string>Liberation Sans</string></edit></match>
  <match target="pattern"><test name="family" qual="any"><string>Arial Narrow</string></test><edit name="family" mode="assign" binding="strong"><string>Liberation Sans</string></edit></match>
  <match target="pattern"><test name="family" qual="any"><string>Helvetica</string></test><edit name="family" mode="assign" binding="strong"><string>Liberation Sans</string></edit></match>
  <match target="pattern"><test name="family" qual="any"><string>Segoe UI</string></test><edit name="family" mode="assign" binding="strong"><string>Liberation Sans</string></edit></match>
  <match target="pattern"><test name="family" qual="any"><string>Tahoma</string></test><edit name="family" mode="assign" binding="strong"><string>Liberation Sans</string></edit></match>
  <match target="pattern"><test name="family" qual="any"><string>Trebuchet MS</string></test><edit name="family" mode="assign" binding="strong"><string>Liberation Sans</string></edit></match>
  <match target="pattern"><test name="family" qual="any"><string>Century Gothic</string></test><edit name="family" mode="assign" binding="strong"><string>Liberation Sans</string></edit></match>
  <match target="pattern"><test name="family" qual="any"><string>Verdana</string></test><edit name="family" mode="assign" binding="strong"><string>DejaVu Sans</string></edit></match>
  <match target="pattern"><test name="family" qual="any"><string>Calibri</string></test><edit name="family" mode="assign" binding="strong"><string>Carlito</string></edit></match>
  <match target="pattern"><test name="family" qual="any"><string>Cambria</string></test><edit name="family" mode="assign" binding="strong"><string>Caladea</string></edit></match>
  <match target="pattern"><test name="family" qual="any"><string>Times New Roman</string></test><edit name="family" mode="assign" binding="strong"><string>Liberation Serif</string></edit></match>
  <match target="pattern"><test name="family" qual="any"><string>Times</string></test><edit name="family" mode="assign" binding="strong"><string>Liberation Serif</string></edit></match>
  <match target="pattern"><test name="family" qual="any"><string>Georgia</string></test><edit name="family" mode="assign" binding="strong"><string>Liberation Serif</string></edit></match>
  <match target="pattern"><test name="family" qual="any"><string>Garamond</string></test><edit name="family" mode="assign" binding="strong"><string>Liberation Serif</string></edit></match>
  <match target="pattern"><test name="family" qual="any"><string>Book Antiqua</string></test><edit name="family" mode="assign" binding="strong"><string>Liberation Serif</string></edit></match>
  <match target="pattern"><test name="family" qual="any"><string>Palatino Linotype</string></test><edit name="family" mode="assign" binding="strong"><string>Liberation Serif</string></edit></match>
  <match target="pattern"><test name="family" qual="any"><string>Bookman Old Style</string></test><edit name="family" mode="assign" binding="strong"><string>Liberation Serif</string></edit></match>
</fontconfig>
