[project]
name = "minuta-backend"
version = "0.1.0"
description = "API e worker do SaaS de geração de documentos por modelos e campos variáveis"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-multipart>=0.0.9",
  "python-docx>=1.1",
  "lxml>=5.2",
  "openpyxl>=3.1",
  "argon2-cffi>=23.1",
  "httpx>=0.27",
  "boto3>=1.34",
  "redis>=5.0",
  "dramatiq[redis]>=1.17",
  "prometheus-client>=0.20",
  "defusedxml>=0.7",
  # PDF digitado → .docx (MIT / Apache-BSD; evitamos PyMuPDF/pdf2docx por serem AGPL)
  "pdfplumber>=0.11",
  "pypdfium2>=4.30",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
dev = [
  "pytest>=8.2",
  "pytest-timeout>=2.3",
  "ruff>=0.5",
  "mypy>=1.10",
  "pillow>=10.3",
  "pypdf>=4.0",  # só para gerar um PDF com senha nos testes
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
timeout = 120
markers = [
  "libreoffice: exige o binário soffice (roda no container do worker)",
  "postgres: exige TEST_DATABASE_URL apontando para PostgreSQL",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C4", "SIM", "RUF"]
ignore = [
  "S101",   # assert em testes
  "B008",   # Depends() em defaults é o idioma do FastAPI
  "E501",
  "RUF001", "RUF002", "RUF003",  # acentos e símbolos em português são intencionais
  "S105", "S106",
  "UP042",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B011"]
"seed/*" = ["S"]
"migrations/*" = ["I", "E", "UP", "RUF"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
